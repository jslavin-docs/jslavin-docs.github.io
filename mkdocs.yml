site_name: Jeff Slavin | Lead Technical Writer
site_description: Documentation portfolio spanning GitOps, DevSecOps, APIs, cloud, edge, and IoT.
site_author: Jeff Slavin
site_url: https://jslavin-docs.github.io/

repo_url: https://github.com/jslavin-docs/jslavin-docs.github.io
repo_name: GitHub

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  language: en
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Portfolio: portfolio.md
  - Resume: resume.md

not_in_nav: |
  /404.md
  /writing-samples/novadeploy-gitops-admin-guide-portfolio-cut.md
  /writing-samples/novadeploy-gitops-admin-guide-full-version.md

extra_css:
  - assets/custom.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search
  - social
extra:
  analytics:
    provider: google
    property: G-4K07NSBTQL
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jslavin-docs
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jeff-slavin
