name: Build and deploy MkDocs portfolio

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install image-processing system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  quality:
    name: Build strict, check links, validate HTML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install image-processing system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build site with strict mode
        run: mkdocs build --strict --site-dir site

      - name: Check internal links
        run: python scripts/check_internal_links.py site

      - name: Set up Java for the HTML checker
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The Nu HTML Checker is the engine behind validator.w3.org. The checker
      # and the Maven plugin that fetches it are both pinned, so an update to
      # either cannot change the result on its own.
      - name: Fetch the Nu HTML Checker
        run: |
          mkdir -p "$RUNNER_TEMP/vnu"
          cat > "$RUNNER_TEMP/vnu/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local</groupId>
            <artifactId>html-check</artifactId>
            <version>1</version>
            <dependencies>
              <dependency>
                <groupId>nu.validator</groupId>
                <artifactId>validator</artifactId>
                <version>26.10.9</version>
              </dependency>
            </dependencies>
          </project>
          POM
          mvn -q -B -f "$RUNNER_TEMP/vnu/pom.xml" org.apache.maven.plugins:maven-dependency-plugin:3.11.0:copy-dependencies -DoutputDirectory="$RUNNER_TEMP/vnu/lib" -DincludeScope=runtime

      # Errors fail the build and block the deploy; warnings do not. Verbose
      # output lists each file checked. The Google site-verification file is a
      # plain token, not HTML.
      - name: Check built pages are valid HTML
        run: |
          find site -name '*.html' ! -name 'google*.html' -print0 | xargs -0 java -cp "$RUNNER_TEMP/vnu/lib/*" nu.validator.client.SimpleCommandLineValidator --errors-only --no-langdetect --verbose

  lighthouse:
    name: Lighthouse CI advisory audit
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node for Lighthouse CI
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install image-processing system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build site with strict mode
        run: mkdocs build --strict --site-dir site

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.x

      - name: Run Lighthouse CI advisory audit
        run: lhci autorun

      - name: Upload Lighthouse reports as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lhci-reports
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages when public
    needs:
      - build
      - quality
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
